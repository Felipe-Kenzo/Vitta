# Pipeline CI/CD do Vitta
# Fluxo: Codigo -> Azure Repos -> Azure Pipeline -> Build -> Deploy (Azure Web App)
#
# ANTES DE USAR, troque os dois valores da secao "variables":
#   azureSubscription -> nome da Service Connection (Project Settings > Service connections)
#   webAppName        -> nome do Web App criado no Azure (ex.: vitta-felipe)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'COLOQUE-AQUI-O-NOME-DA-SERVICE-CONNECTION'
  webAppName: 'COLOQUE-AQUI-O-NOME-DO-WEBAPP'

stages:
  - stage: Build
    displayName: 'Build e testes (CI)'
    jobs:
      - job: BuildJob
        displayName: 'Instalar, testar e empacotar'
        steps:
          - task: NodeTool@0
            displayName: 'Instalar Node.js 20'
            inputs:
              versionSpec: '20.x'

          - script: npm install --omit=dev
            displayName: 'Instalar dependencias'

          - script: npm test
            displayName: 'Rodar testes'

          - task: ArchiveFiles@2
            displayName: 'Empacotar aplicacao (zip)'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            displayName: 'Publicar artefato'
            artifact: drop

  - stage: Deploy
    displayName: 'Deploy no Azure Web App (CD)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWeb
        displayName: 'Publicar no Web App'
        environment: 'producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy no Azure Web App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/app.zip'
                    runtimeStack: 'NODE|20-lts'
                    startUpCommand: 'npm start'
